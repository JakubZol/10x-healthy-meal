name: Run Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./10x-healthy-meal-frontend

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: './10x-healthy-meal-frontend/package-lock.json'

    - name: Install dependencies
      run: npm ci

    - name: Run tests
      run: npm run test:run
      env:
        NODE_ENV: test
        OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        OPENROUTER_BASE_URL: https://openrouter.ai/api/v1
        OPENROUTER_DEFAULT_MODEL: anthropic/claude-3-haiku
        DEFAULT_AI_MODEL: anthropic/claude-3-haiku
        AI_GENERATION_TIMEOUT_MS: 30000

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results-${{ matrix.node-version }}
        path: |
          ./10x-healthy-meal-frontend/coverage/
          ./10x-healthy-meal-frontend/test-results.xml
        retention-days: 30

    - name: Comment PR with test results
      uses: actions/github-script@v7
      if: github.event_name == 'pull_request' && always()
      with:
        script: |
          const fs = require('fs');
          const path = require('path');
          
          // Try to read test results and create a comment
          let comment = '## 🧪 Test Results\n\n';
          
          try {
            // Add basic test status
            comment += `✅ Tests completed for Node.js ${{ matrix.node-version }}\n`;
            comment += `📊 Check the Actions tab for detailed results\n`;
          } catch (error) {
            comment += `❌ Error reading test results: ${error.message}\n`;
          }
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: comment
          });
