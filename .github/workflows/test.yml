name: Run Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./10x-healthy-meal-frontend

    strategy:
      matrix:
        node-version: [22.x]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: './10x-healthy-meal-frontend/package-lock.json'

    - name: Install dependencies
      run: npm ci

    - name: Run tests
      run: npm run test app/profile/add-recipe/tests/page
      env:
        NODE_ENV: test
        OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        OPENROUTER_BASE_URL: https://openrouter.ai/api/v1
        OPENROUTER_DEFAULT_MODEL: anthropic/claude-3-haiku
        DEFAULT_AI_MODEL: anthropic/claude-3-haiku
        AI_GENERATION_TIMEOUT_MS: 30000
